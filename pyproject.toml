[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-rag-citation-auditor"
version = "0.1.0"
description = "Retrieval-augmented QA with claim-level citation and hallucination auditing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
nli = ["sentence-transformers>=3.0"]

[project.scripts]
rag-auditor = "rag_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["rag_auditor*"]

[tool.setuptools.package-data]
rag_auditor = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
